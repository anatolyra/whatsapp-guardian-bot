name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview version without releasing'
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest-tag
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$LATEST" == "none" ]; then
            echo "::error::No tags found. Create an initial tag (e.g., v0.0.0) before running release."
            exit 1
          fi
          echo "tag=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST"

      - name: Get merged PRs since last release
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_TAG=${{ steps.latest-tag.outputs.tag }}
          PRS=$(gh pr list --state merged --limit 1000 --json number,title,labels,author --search "merged:>${LAST_TAG}")
          echo "prs<<EOF" >> $GITHUB_OUTPUT
          echo "$PRS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: version
        run: |
          LAST_TAG=${{ steps.latest-tag.outputs.tag }}
          PRS='${{ steps.prs.outputs.prs }}'
          
          CURRENT=$(echo "$LAST_TAG" | sed 's/^v//')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          
          PR_COUNT=$(echo "$PRS" | jq 'length')
          
          if [ "$PR_COUNT" -eq 0 ]; then
            echo "::error::No merged PRs since last release ($LAST_TAG). Nothing to release."
            exit 1
          fi
          
          echo "Found $PR_COUNT merged PRs since $LAST_TAG"
          
          for i in $(seq 0 $((PR_COUNT - 1))); do
            LABEL_NAMES=$(echo "$PRS" | jq -r ".[$i].labels[].name" | tr '\n' ' ')
            BUMP="patch"
            for LABEL in $LABEL_NAMES; do
              case $LABEL in
                major) BUMP="major"; break ;;
                minor) BUMP="minor" ;;
                patch) BUMP="patch" ;;
              esac
            done
            
            case $BUMP in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
          done
          
          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Dry run - preview only
        if: ${{ github.event.inputs.dry-run == 'true' }}
        run: |
          echo "=== DRY RUN MODE ==="
          echo "Would release version: ${{ steps.version.outputs.version }}"
          echo ""
          echo "Merged PRs since last release:"
          PRS='${{ steps.prs.outputs.prs }}'
          PR_COUNT=$(echo "$PRS" | jq 'length')
          for i in $(seq 0 $((PR_COUNT - 1))); do
            PR_NUMBER=$(echo "$PRS" | jq -r ".[$i].number")
            PR_TITLE=$(echo "$PRS" | jq -r ".[$i].title")
            echo "  #$PR_NUMBER: $PR_TITLE"
          done
          echo ""
          echo "To actually release, run again without dry-run."
          exit 0

      - name: Set up Python 3.11
        if: ${{ github.event.inputs.dry-run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: ${{ github.event.inputs.dry-run != 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        if: ${{ github.event.inputs.dry-run != 'true' }}
        run: python -m pytest tests/ -v

      - name: Set up Docker Buildx
        if: ${{ github.event.inputs.dry-run != 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        if: ${{ github.event.inputs.dry-run != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: ${{ github.event.inputs.dry-run != 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Create git tag
        if: ${{ github.event.inputs.dry-run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.version }} -m "Release ${{ steps.version.outputs.version }}"
          git push origin ${{ steps.version.outputs.version }}

      - name: Generate release notes
        if: ${{ github.event.inputs.dry-run != 'true' }}
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md
          PRS='${{ steps.prs.outputs.prs }}'
          PR_COUNT=$(echo "$PRS" | jq 'length')
          for i in $(seq 0 $((PR_COUNT - 1))); do
            PR_NUMBER=$(echo "$PRS" | jq -r ".[$i].number")
            PR_TITLE=$(echo "$PRS" | jq -r ".[$i].title")
            PR_AUTHOR=$(echo "$PRS" | jq -r ".[$i].author.login")
            echo "- $PR_TITLE (#$PR_NUMBER) by @$PR_AUTHOR" >> release_notes.md
          done

      - name: Create GitHub Release
        if: ${{ github.event.inputs.dry-run != 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body_path: release_notes.md
          generate_release_notes: false